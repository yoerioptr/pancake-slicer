name: Auto Version Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version bump
        id: version
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          if [ -z "$latest_tag" ]; then
            latest_tag="0.0.0"
            commit_range="HEAD"
            echo "No existing semver tag found, starting from $latest_tag."
          else
            commit_range="${latest_tag}..HEAD"
            echo "Latest semver tag: $latest_tag"
          fi

          subjects="$(git log "$commit_range" --pretty=format:%s)"
          messages="$(git log "$commit_range" --pretty=format:%B)"

          bump="patch"

          if printf '%s\n' "$messages" | grep -qE 'BREAKING[ -]CHANGE'; then
            bump="major"
          elif printf '%s\n' "$subjects" | grep -qE '^[A-Za-z]+(\([^)]*\))?!:'; then
            bump="major"
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
            bump="minor"
          fi

          IFS='.' read -r major minor patch <<< "$latest_tag"

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_tag="${major}.${minor}.${patch}"

          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Bump: $bump -> $new_tag"

      - name: Create and push annotated tag
        id: create-tag
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "::notice::Tag $NEW_TAG already exists, nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_TAG" -m "chore: release $NEW_TAG"
          git push origin "$NEW_TAG"

          echo "created=true" >> "$GITHUB_OUTPUT"
